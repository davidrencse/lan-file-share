[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanshare"
version = "1.0.0"
description = "Reasonably secure cross-platform LAN file sharing (Windows <-> Linux)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["cryptography>=3.4"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
lanshare = "lanshare.cli:main"

[tool.setuptools]
packages = ["lanshare", "lanshare.gui", "lanshare.gui.pages"]
